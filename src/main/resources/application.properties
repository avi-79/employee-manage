spring.application.name=employee-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/employee_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
server.error.include-message=always

# JWT signing key (HS256, at least 32 bytes). Override with JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Default admin account created on startup if missing
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

springdoc.swagger-ui.path=/swagger-ui.html
