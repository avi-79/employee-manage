services:
  postgres:
    image: postgres:17
    container_name: employee-postgres
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host 5433 (5432 is used by another container)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: employee-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/employee_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: docker-local-secret-change-me-0123456789abcdef
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: employee-ui
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  postgres_data:
